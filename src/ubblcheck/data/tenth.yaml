  V:
    title: Shops
    rows:
      - {ref: "V 2(d)", storeys: [1, 1], total_area: [2000, null], ext: AG, alarm: "2", light: a}
      - {ref: "V 2(c)", storeys: [1, 1], total_area: [1000, 2000], ext: G, alarm: "1&2", light: a}
      - {ref: "V 2(b)", storeys: [1, 1], total_area: [750, 1000], ext: G, alarm: "2", light: a}
      - {ref: "V 2(a)", storeys: [1, 1], total_area: [0, 750], ext: "", alarm: "", light: ""}
      - {ref: "V 3", storeys: [2, 2], total_area: [2000, null], ext: AG, alarm: "2", light: c}
      - {ref: "V 3", storeys: [2, 2], total_area: [1000, 2000], ext: G, alarm: "1&2", light: a}
      - {ref: "V 3", storeys: [2, 2], total_area: [750, 1000], ext: G, alarm: "2", light: a}
      - {ref: "V 3", storeys: [2, 2], total_area: [0, 750], ext: G, alarm: "", light: a}
      - {ref: "V 3", storeys: [3, null], total_area: [3000, null], ext: AG, alarm: "2", light: c}
      - {ref: "V 3", storeys: [3, null], total_area: [1000, 3000], ext: G, alarm: "1&2", light: a}
      - {ref: "V 3", storeys: [3, null], total_area: [0, 1000], ext: G, alarm: "2", light: a}

  VI:
    title: Factories (single storey, two storeys with each floor a compartment, flatted factories)
    rows:
      - {ref: "VI 4(c)", storeys: [6, null], ext: AG, alarm: "2", light: c}
      - {ref: "VI 4(b)", storeys: [3, 5], volume: [7000, null], ext: AG, alarm: "2", light: c}
      - {ref: "VI 4(b)", storeys: [3, 5], ext: HG, alarm: "1&2", light: c}
      - {ref: "VI 3(d)", storeys: [2, 2], floor_area: [1000, null], ext: AG, alarm: "1&2", light: a}
      - {ref: "VI 3(c)", storeys: [2, 2], floor_area: [750, 1000], ext: G, alarm: "1&2", light: a}
      - {ref: "VI 3(b)", storeys: [2, 2], floor_area: [500, 750], ext: G, alarm: "2", light: a}
